 <style>
  rect {
   transform-box: fill-box;
   transform-origin: center;
   opacity: .78;
   fill: #171717;
   animation: wave 1.8s ease-in-out infinite, palette 5.4s linear infinite;
   animation-delay: var(--wave-delay), var(--color-delay);
  }
  @keyframes wave {
   0%, 65%, 100% { opacity: .78; transform: scale(.78); }
   25%, 35% { opacity: 1; transform: scale(1); }
  }
  @keyframes palette {
   0%, 100% { fill: #171717; }
   33% { fill: #404040; }
   66% { fill: #666666; }
  }
  @media (prefers-reduced-motion: reduce) {
   rect { animation: none; opacity: 1; transform: none; }
  }
