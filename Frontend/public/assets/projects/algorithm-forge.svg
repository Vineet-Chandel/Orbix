<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#0F141C;">
  <defs>
    <pattern id="forgeGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#222C3D" />
    </pattern>
    <filter id="shadowDark" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="6" dy="6" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="#0F141C" />
  <rect width="1200" height="675" fill="url(#forgeGrid)" />
  <rect width="1200" height="675" fill="none" stroke="#000000" stroke-width="8" />

  <!-- Top Bar -->
  <g transform="translate(40, 36)">
    <rect x="0" y="0" width="1120" height="54" rx="14" fill="#171F2C" stroke="#222C3D" stroke-width="3" filter="url(#shadowDark)" />
    <circle cx="28" cy="27" r="6" fill="#FF5F56" />
    <circle cx="48" cy="27" r="6" fill="#FFBD2E" />
    <circle cx="68" cy="27" r="6" fill="#27C93F" />

    <rect x="96" y="12" width="230" height="30" rx="8" fill="#000000" stroke="#222C3D" stroke-width="1.5" />
    <text x="211" y="32" font-family="ui-monospace, monospace" font-size="12" font-weight="900" fill="#a2ff86" text-anchor="middle" letter-spacing="1">ALGORITHM FORGE // C++20</text>

    <text x="345" y="33" font-family="ui-monospace, monospace" font-size="12" font-weight="800" fill="#E2E8F0">1,200+ ADVANCED DATA STRUCTURES</text>

    <rect x="930" y="11" width="175" height="32" rx="16" fill="#3B82F6" stroke="#000000" stroke-width="2" />
    <text x="1017" y="32" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle">100% GOOGLE TEST</text>
  </g>

  <!-- Main Body -->
  <g transform="translate(40, 116)">
    <!-- Left Hero Card -->
    <rect x="0" y="0" width="560" height="500" rx="24" fill="#171F2C" stroke="#222C3D" stroke-width="3" filter="url(#shadowDark)" />

    <g transform="translate(36, 44)">
      <rect x="0" y="0" width="130" height="28" rx="8" fill="#a2ff86" stroke="#000000" stroke-width="2" />
      <text x="65" y="19" font-family="system-ui, sans-serif" font-size="11" font-weight="950" fill="#000000" text-anchor="middle" letter-spacing="1">OPEN SOURCE</text>

      <text x="0" y="78" font-family="system-ui, sans-serif" font-size="44" font-weight="950" fill="#FFFFFF" letter-spacing="-1">Algorithm Forge</text>
      <text x="0" y="114" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#94A3B8">High-Performance Algorithmic Core</text>

      <g transform="translate(0, 140)">
        <rect x="0" y="0" width="488" height="155" rx="14" fill="#0F141C" stroke="#222C3D" stroke-width="2" />
        <g transform="translate(20, 24)">
          <text x="0" y="16" font-family="ui-monospace, monospace" font-size="12" font-weight="800" fill="#64748B">DATA STRUCTURES</text>
          <text x="0" y="44" font-family="system-ui, sans-serif" font-size="28" font-weight="950" fill="#a2ff86">1,240+</text>

          <text x="240" y="16" font-family="ui-monospace, monospace" font-size="12" font-weight="800" fill="#64748B">SIMD ACCELERATION</text>
          <text x="240" y="44" font-family="system-ui, sans-serif" font-size="28" font-weight="950" fill="#38BDF8">AVX-512</text>

          <text x="0" y="90" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#F8FAFC">✓ Segment Trees with Lazy Propagation</text>
          <text x="240" y="90" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#F8FAFC">✓ Suffix Automata &amp; Push-Relabel</text>
        </g>
      </g>

      <!-- Tech Pills -->
      <g transform="translate(0, 330)">
        <rect x="0" y="0" width="80" height="28" rx="6" fill="#0F141C" stroke="#222C3D" stroke-width="1.5" />
        <text x="40" y="19" font-family="ui-monospace, monospace" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle">C++20</text>

        <rect x="90" y="0" width="80" height="28" rx="6" fill="#0F141C" stroke="#222C3D" stroke-width="1.5" />
        <text x="130" y="19" font-family="ui-monospace, monospace" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle">CMake</text>

        <rect x="180" y="0" width="105" height="28" rx="6" fill="#0F141C" stroke="#222C3D" stroke-width="1.5" />
        <text x="232" y="19" font-family="ui-monospace, monospace" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle">GoogleTest</text>

        <rect x="295" y="0" width="80" height="28" rx="6" fill="#0F141C" stroke="#222C3D" stroke-width="1.5" />
        <text x="335" y="19" font-family="ui-monospace, monospace" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle">Python</text>

        <rect x="385" y="0" width="103" height="28" rx="6" fill="#0F141C" stroke="#222C3D" stroke-width="1.5" />
        <text x="436" y="19" font-family="ui-monospace, monospace" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle">CI Fuzzing</text>
      </g>
    </g>

    <!-- Right Tree & Graph Schematic Card -->
    <g transform="translate(590, 0)">
      <rect x="0" y="0" width="530" height="500" rx="24" fill="#171F2C" stroke="#222C3D" stroke-width="3" filter="url(#shadowDark)" />

      <g transform="translate(30, 30)">
        <text x="0" y="20" font-family="ui-monospace, monospace" font-size="13" font-weight="900" fill="#a2ff86">HEAVY-LIGHT DECOMPOSITION &amp; SEGMENT TREE</text>

        <!-- Segment Tree Diagram -->
        <g transform="translate(40, 50)">
          <!-- Root -->
          <circle cx="225" cy="30" r="24" fill="#3B82F6" stroke="#FFFFFF" stroke-width="2" />
          <text x="225" y="35" font-family="ui-monospace, monospace" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle">[1..N]</text>

          <!-- Branch Lines -->
          <line x1="210" y1="48" x2="110" y2="105" stroke="#64748B" stroke-width="2.5" />
          <line x1="240" y1="48" x2="340" y2="105" stroke="#64748B" stroke-width="2.5" />

          <!-- Level 1 Nodes -->
          <circle cx="110" cy="115" r="22" fill="#10B981" stroke="#FFFFFF" stroke-width="2" />
          <text x="110" y="120" font-family="ui-monospace, monospace" font-size="10" font-weight="900" fill="#FFFFFF" text-anchor="middle">[1..M]</text>

          <circle cx="340" cy="115" r="22" fill="#10B981" stroke="#FFFFFF" stroke-width="2" />
          <text x="340" y="120" font-family="ui-monospace, monospace" font-size="10" font-weight="900" fill="#FFFFFF" text-anchor="middle">[M+1..N]</text>

          <!-- Level 2 Lines -->
          <line x1="95" y1="132" x2="45" y2="185" stroke="#64748B" stroke-width="2" />
          <line x1="125" y1="132" x2="175" y2="185" stroke="#64748B" stroke-width="2" />
          <line x1="325" y1="132" x2="275" y2="185" stroke="#64748B" stroke-width="2" />
          <line x1="355" y1="132" x2="405" y2="185" stroke="#64748B" stroke-width="2" />

          <!-- Level 2 Leaves -->
          <circle cx="45" cy="195" r="18" fill="#1E293B" stroke="#a2ff86" stroke-width="2" />
          <circle cx="175" cy="195" r="18" fill="#1E293B" stroke="#a2ff86" stroke-width="2" />
          <circle cx="275" cy="195" r="18" fill="#1E293B" stroke="#a2ff86" stroke-width="2" />
          <circle cx="405" cy="195" r="18" fill="#1E293B" stroke="#a2ff86" stroke-width="2" />
        </g>

        <!-- Complexity Matrix -->
        <g transform="translate(0, 310)">
          <rect x="0" y="0" width="470" height="120" rx="14" fill="#0F141C" stroke="#222C3D" stroke-width="2" />
          <g transform="translate(20, 20)">
            <text x="0" y="16" font-family="ui-monospace, monospace" font-size="11" font-weight="900" fill="#38BDF8">COMPLEXITY BENCHMARKS</text>
            <text x="0" y="40" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#CBD5E1">Point Update: O(log N) • Range Sum Query: O(log N)</text>
            <text x="0" y="62" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#CBD5E1">Heavy-Light Path Query: O(log² N) with lazy propagation</text>
            <text x="0" y="84" font-family="ui-monospace, monospace" font-size="11" font-weight="800" fill="#a2ff86">Cache misses: Reduced 4.6x vs traditional pointer trees</text>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
