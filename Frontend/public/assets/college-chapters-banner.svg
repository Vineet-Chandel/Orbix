  <!-- BOTTOM ACCENT BANNER (FOOTER BAR) -->
  <g transform="translate(40, 564)">
    <rect x="0" y="0" width="1120" height="36" rx="10" fill="#000000" stroke="#000000" stroke-width="2" />
    <circle cx="20" cy="18" r="4" fill="#a2ff86" />
    <text x="32" y="22" font-family="ui-monospace, monospace" font-size="11" font-weight="800" fill="#FFFFFF">ARCHITECTURAL SPECIFICATION: COLLEGE CHAPTERS &amp; CAMPUS ECOSYSTEM</text>
    <text x="1104" y="22" font-family="ui-monospace, monospace" font-size="11" font-weight="800" fill="#FFE566" text-anchor="end">OPEN TO ALL INDIAN COLLEGES &amp; UNIVERSITIES →</text>
  </g>
</svg>
