        <text x="241" y="18" font-family="system-ui, sans-serif" font-size="10" font-weight="900" fill="#000000" text-anchor="middle">PAN-INDIA ARENAS</text>
        <text x="241" y="32" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#E65100" text-anchor="middle">Nationwide Open</text>

