    <rect x="0" y="0" width="1120" height="52" rx="14" fill="#FFFFFF" stroke="#000000" stroke-width="3" filter="url(#shadow4)" />
    
    <!-- Window Dots -->
    <circle cx="28" cy="26" r="6" fill="#FF5F56" stroke="#000000" stroke-width="2" />
    <circle cx="48" cy="26" r="6" fill="#FFBD2E" stroke="#000000" stroke-width="2" />
    <circle cx="68" cy="26" r="6" fill="#27C93F" stroke="#000000" stroke-width="2" />

    <!-- Orbix Logo Badge -->
    <rect x="96" y="11" width="140" height="30" rx="8" fill="#000000" />
    <text x="166" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="900" fill="#a2ff86" text-anchor="middle" letter-spacing="1.5">ORBIX // DOCS</text>

    <!-- Protocol Breadcrumb -->
    <text x="254" y="32" font-family="ui-monospace, monospace" font-size="13" font-weight="800" fill="#000000">CAMPUS CHAPTER GOVERNANCE &amp; ARCHITECTURE STANDARD</text>

    <!-- AISHE Status Pill -->
    <rect x="910" y="10" width="195" height="32" rx="16" fill="#FFE566" stroke="#000000" stroke-width="2" />
    <circle cx="928" cy="26" r="4" fill="#000000" />
    <text x="942" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#000000" letter-spacing="0.5">AISHE INDEXED // C-46844</text>
  </g>

  <!-- HERO TITLE & TAGLINE SECTION -->
  <g transform="translate(40, 114)">
    <!-- Decorative Accent Pill -->
    <rect x="0" y="0" width="270" height="30" rx="15" fill="#FF9933" stroke="#000000" stroke-width="2.5" filter="url(#shadow4)" />
    <text x="135" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="1">PAN-INDIA &amp; CAMPUS ECOSYSTEM</text>

