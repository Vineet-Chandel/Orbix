<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" style="background:#FAF6EE;">
  <defs>
    <!-- Dot Grid Pattern -->
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#D8D0C5" />
    </pattern>
    
    <!-- Diagonal Stripes Pattern -->
    <pattern id="stripes" width="20" height="20" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="20" stroke="#000000" stroke-width="3" opacity="0.08" />
    </pattern>

    <!-- Hard Drop Shadow Filters -->
    <filter id="shadow4" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="shadow6" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="6" dy="6" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="shadow8" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="8" dy="8" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
  </defs>

  <!-- Background Base with Grid -->
  <rect width="1200" height="630" fill="#FAF6EE" />
  <rect width="1200" height="630" fill="url(#dotGrid)" />
  <rect width="1200" height="630" fill="none" stroke="#000000" stroke-width="6" />

  <!-- Corner Brackets (Tech Neo-Brutalism) -->
  <path d="M 16 48 L 16 16 L 48 16" fill="none" stroke="#000000" stroke-width="4" />
  <path d="M 1184 48 L 1184 16 L 1152 16" fill="none" stroke="#000000" stroke-width="4" />
  <path d="M 16 582 L 16 614 L 48 614" fill="none" stroke="#000000" stroke-width="4" />
  <path d="M 1184 582 L 1184 614 L 1152 614" fill="none" stroke="#000000" stroke-width="4" />

  <!-- TOP STATUS BAR -->
  <g transform="translate(40, 32)">
