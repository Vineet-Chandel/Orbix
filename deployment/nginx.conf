# ==============================================================================
# Orbix Production Nginx Server Configuration
# ==============================================================================
# Upstream Express 5 API running on PM2 (Port 3000)
# Static Frontend hosted at /var/www/orbix/dist (or /var/www/html)

server {
    listen 80;
    server_name _;

    # Client upload limits (accommodates 10MB banners, PDFs, and avatars)
    client_max_body_size 12M;

    # Static build root directory
    root /var/www/html;
    index index.html;

    # Gzip compression for performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # --------------------------------------------------------------------------
    # 1. Standardized Backend API Routing (/api/* -> Express :3000)
    # --------------------------------------------------------------------------
    # Crucial: Preserves /api/ prefix without trailing slash on proxy_pass so that
    # /api/auth/signin is forwarded cleanly as /api/auth/signin to Express 5.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket support (for realtime notifications and subscriptions)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cookie & CORS header preservation
        proxy_pass_header Set-Cookie;
        proxy_cookie_path / /;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # 2. Vite Static Assets Caching
    # --------------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # 3. React Frontend Page Navigation (SPA Client Routing)
    # --------------------------------------------------------------------------
    # Ensures client-side routes (/auth/signin, /club/dashboard, /events, etc.)
    # resolve directly to index.html on direct URL entry and page refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
